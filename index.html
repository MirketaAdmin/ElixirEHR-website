<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Google Consent Mode v2 defaults: every optional category denied until the visitor chooses,
      then the saved choice re-applied before any other script runs. Google Tag Manager and GA4
      follow this block, so they start under these defaults. Keep the key, version and signal
      mapping in step with src/consent/consent.js.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'denied',
        personalization_storage: 'denied',
        security_storage: 'granted',
        wait_for_update: 500,
      });
      try {
        var saved = JSON.parse(localStorage.getItem('elixir-cookie-consent'));
        if (saved && saved.version === 1 && saved.categories) {
          var c = saved.categories;
          var marketing = c.marketing === true && navigator.globalPrivacyControl !== true;
          var state = function (granted) {
            return granted ? 'granted' : 'denied';
          };
          gtag('consent', 'update', {
            analytics_storage: state(c.analytics === true),
            ad_storage: state(marketing),
            ad_user_data: state(marketing),
            ad_personalization: state(marketing),
            functionality_storage: state(c.functional === true),
            personalization_storage: state(c.functional === true),
          });
        }
      } catch (e) {}
    </script>
    <!-- Google Tag Manager (GTM-524CCF2) -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'GTM-524CCF2');
    </script>
    <!-- End Google Tag Manager -->
    <!-- Google tag (gtag.js), GA4 G-HE9TB0G122. `gtag` and `dataLayer` are defined in the consent
         block above. The GTM container has no GA4 tag for this ID, so page views are not doubled;
         if one is ever added there, remove this snippet. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HE9TB0G122"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-HE9TB0G122');
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Title, description and canonical are rendered per page (React hoists them into <head>), so
         none are set here: a static copy would duplicate them on every page. -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-524CCF2"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
